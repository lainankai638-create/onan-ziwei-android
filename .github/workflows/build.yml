name: Build Ziwei Android APK

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Extract project ZIP
        run: |
          unzip -q onan-ziwei-android-source-v0.1.zip -d extracted
          PROJECT_FILE="$(find extracted -type f -name package.json -print -quit)"
          test -n "$PROJECT_FILE"
          cp -a "$(dirname "$PROJECT_FILE")/." .
          test -f package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Build APK
        run: |
          npm install --no-audit --no-fund
          npm run engine
          npm test
          npm run build
          npx cap add android
          npx cap sync android
          cd android
          bash ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: onan-ziwei-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
